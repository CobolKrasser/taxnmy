name: referee-search-measure

# A measurement of the model of step 4 (TAX-49). Started by hand; one approval for the whole run.
#
#   search   environment referee (the key; a maintainer approves): the searches of an earlier run,
#            `repeats` times on one model, within the cap. Nothing is read and nothing is judged.
#            One run directory per repeat, each kept as an artifact for the budget.
#   read     no key: reads the URLs found, as a round reads them, and writes the report: per run and
#            per product, next to the earlier run.

on:
  workflow_dispatch:
    inputs:
      base_run:
        description: "the id of an earlier run of referee-import: its searches (artifact import-search-<id>) and their cost"
        type: string
        default: "44764232264"
      base_file:
        description: "instead of base_run: a search.json or closed.json in the repository; empty: base_run"
        type: string
        default: ""
      repeats:
        description: "how many times each search runs (1 to 5)"
        type: string
        default: "3"
      model:
        description: "empty: the model of step 4 (tools/referee.py SEARCH_MODEL)"
        type: string
        default: ""
      cap:
        description: "dollars, the cap of this measurement (hard limit)"
        type: string
        default: "0.75"

permissions:
  contents: read

concurrency:
  group: referee-search-measure
  cancel-in-progress: false

jobs:
  search:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: referee  # the key; a maintainer approves
    concurrency:
      group: referee-judge  # one paid job at a time, so the budget cannot be spent twice
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read  # earlier runs, for the budget and the base
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5  # no cache in a job that reads artifacts
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-referee.txt
      - name: Gather earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/gather-runs.sh
      - uses: actions/download-artifact@v4
        if: inputs.base_file == ''
        with:
          name: import-search-${{ inputs.base_run }}
          path: ${{ runner.temp }}/base
          run-id: ${{ inputs.base_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.base_file == ''
        with:
          pattern: referee-run-*-search-*
          path: ${{ runner.temp }}/base-run
          run-id: ${{ inputs.base_run }}
          github-token: ${{ github.token }}
      - name: The searches, repeated
        id: search
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_RUN: ${{ inputs.base_run }}
          BASE_FILE: ${{ inputs.base_file }}
          REPEATS: ${{ inputs.repeats }}
          MODEL: ${{ inputs.model }}
          CAP: ${{ inputs.cap }}
          BUDGET: ${{ vars.REFEREE_BUDGET || '50.00' }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_FILE" ]; then
            base=(--base "$BASE_FILE" --base-label "$BASE_FILE")
          else
            mapfile -t results < <(find "$RUNNER_TEMP/base-run" -name results.jsonl 2>/dev/null)
            base=(--base "$RUNNER_TEMP/base/search.json" --base-label "run $BASE_RUN")
            if [ "${#results[@]}" -eq 1 ]; then
              model=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["model"])' "$(dirname "${results[0]}")/run.json")
              base=(--base "$RUNNER_TEMP/base/search.json" --base-results "${results[0]}" --base-label "$model, run $BASE_RUN")
            fi
          fi
          python tools/searchmeasure.py search "${base[@]}" --repeats "$REPEATS" --model "$MODEL" --cap "$CAP" \
            --budget "$BUDGET" --output measure/measure.json --live | tee search.log
          { echo "### The searches"; echo; cat search.log; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.search.outputs.dir_1 != ''
        with:
          name: referee-run-${{ steps.search.outputs.name_1 }}
          path: ${{ steps.search.outputs.dir_1 }}
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always() && steps.search.outputs.dir_2 != ''
        with:
          name: referee-run-${{ steps.search.outputs.name_2 }}
          path: ${{ steps.search.outputs.dir_2 }}
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always() && steps.search.outputs.dir_3 != ''
        with:
          name: referee-run-${{ steps.search.outputs.name_3 }}
          path: ${{ steps.search.outputs.dir_3 }}
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always() && steps.search.outputs.dir_4 != ''
        with:
          name: referee-run-${{ steps.search.outputs.name_4 }}
          path: ${{ steps.search.outputs.dir_4 }}
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always() && steps.search.outputs.dir_5 != ''
        with:
          name: referee-run-${{ steps.search.outputs.name_5 }}
          path: ${{ steps.search.outputs.dir_5 }}
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: search-measure-${{ github.run_id }}
          path: measure/
          retention-days: 30

  read:
    needs: search
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5  # no cache in a job that reads artifacts
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-referee.txt -r requirements-fetch.txt
      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: search-measure-${{ github.run_id }}
          path: measure
      - name: Read what the searches found, and the report (no key)
        run: |
          set -euo pipefail
          python tools/searchmeasure.py read --measure measure/measure.json --output measure/report.md > read.log
          cat measure/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: search-measure-${{ github.run_id }}
          path: measure/
          retention-days: 30
          overwrite: true
