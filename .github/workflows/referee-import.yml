name: referee-import

# The KEV round (TAX-27): the importer on the input `found` (CSV files of the find round in
# referee/import/: the eleven groups kev-groep-01..11, or the trial kev-proef-40), past the grouping
# (TAX-26), the gate and the referee (TAX-17), and a pull request with the outcome. Started by hand;
# never merged by itself.
#
#   prepare   no key: the KEV list and the CVE records of the vendors of the rows (public), and the
#             estimate of the grouping (dry run).
#   group     environment referee (the key; a maintainer approves): the grouping, one batch. Main only.
#             With `grouping_run`, it does not run: propose takes the grouping of that earlier run
#             (the grouping is not run again).
#   propose   no key: the importer reads every page (with a browser), parks what it must, and runs
#             the gate of the pull request. It lists the closed pages (closed.json, TAX-49).
#   search    environment referee (the key; a maintainer approves), only for closed pages: one web
#             search each on the publisher's domains, about $0.01, within the cap. Only URLs are kept.
#   reread    no key: propose again on the pages already read, with the URLs of the search. A
#             closed page is not asked again; another page of the publisher that is read and shows
#             the name takes its place for the referee. It replaces the artifact of propose.
#   judge     environment referee (the key; a maintainer approves): the referee on what the gate left, one
#             batch, within what the grouping and the search left of the cap.
#   pull-request  no key: the count per product after the verdict (TAX-39), the outcome on a branch, parked entries in referee/parked.yaml, rejected
#             and aliased files taken out (tools/pr_referee.py apply), and a pull request.
#
# The cap is a hard limit in code for this workflow run (grouping and referee together), next to
# the budget for every run together ($50, tools/referee.py). A pull request opened with the token of
# a workflow starts no other workflow: the referee of TAX-17 does not run on it a second time.

on:
  workflow_dispatch:
    inputs:
      found:
        description: "CSV files in referee/import/, separated by spaces; a pattern such as kev-groep-0[1-6].csv may"
        type: string
        default: "referee/import/kev-proef-40.csv"
      live:
        description: "run it (costs money, at most the cap); off: the dry run only, with the estimate"
        type: boolean
        default: false
      budget:
        description: "dollars, the cap of this run: grouping and referee together (hard limit)"
        type: string
        default: "1.00"
      submitter:
        description: "an agreed round in referee/intake.yaml (TAX-32), whose values replace the shared ceilings; empty: none"
        type: string
        default: ""
      since:
        description: "only KEV entries added on or after this date"
        type: string
        default: "2023-11-16"
      grouping_run:
        description: "the id of an earlier run of this workflow whose grouping propose takes, instead of grouping again (same found); empty: group"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: referee-import
  cancel-in-progress: true

env:
  FOUND: ${{ inputs.found }}  # checked and expanded by .github/scripts/import-found.sh in every job

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # the whole round fetches about 750 CVE records
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-referee.txt
      - name: The KEV list and its CVE records (public; no key)
        env:
          SINCE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          list=$(.github/scripts/import-found.sh "$FOUND")  # stops the step on a wrong input
          mapfile -t files <<< "$list"
          python tools/importer.py list --found "${files[@]}" --since "$SINCE" --out "$RUNNER_TEMP/list" | tee list.log
          python tools/importer.py group --found "${files[@]}" --kev "$RUNNER_TEMP/list/kev.json" --cve "$RUNNER_TEMP/list/cve" \
            --since "$SINCE" --out "$RUNNER_TEMP/dry" | tee dry.log
          python tools/importer.py propose --found "${files[@]}" --classes "$RUNNER_TEMP/dry/classes.json" \
            --names "$RUNNER_TEMP/dry/names.json" --out "$RUNNER_TEMP/dry-propose" > propose.log
          { echo "### KEV round: dry run of ${files[*]}"; echo; cat list.log; echo; cat dry.log; echo
            sed -n '/^- rows/,/^Cost of the grouping/p' "$RUNNER_TEMP/dry-propose/report.md"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: import-list-${{ github.run_id }}
          path: ${{ runner.temp }}/list
          retention-days: 7

  group:
    needs: prepare
    if: github.ref == 'refs/heads/main' && inputs.live && inputs.grouping_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 360  # a batch may take hours; the harness cancels it after 5
    environment: referee
    concurrency:
      group: referee-judge  # one paid job at a time, so the budget cannot be spent twice
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read  # earlier runs, for the budget
    outputs:
      cost: ${{ steps.group.outputs.cost }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5  # no cache in a job that reads artifacts
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-referee.txt
      - name: Gather earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/gather-runs.sh
      - uses: actions/download-artifact@v4
        with:
          name: import-list-${{ github.run_id }}
          path: ${{ runner.temp }}/list
      - name: Group, as one batch
        id: group
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAP: ${{ inputs.budget }}
          SINCE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          list=$(.github/scripts/import-found.sh "$FOUND")  # stops the step on a wrong input
          mapfile -t files <<< "$list"
          python tools/importer.py group --live --cap "$CAP" --found "${files[@]}" --kev "$RUNNER_TEMP/list/kev.json" \
            --cve "$RUNNER_TEMP/list/cve" --since "$SINCE" --out "$RUNNER_TEMP/group" | tee group.log
          { echo "### Grouping"; echo; cat group.log; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the run
        if: always() && steps.group.outputs.run_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: referee-run-${{ steps.group.outputs.run_name }}
          path: ${{ steps.group.outputs.run_dir }}
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: import-group-${{ github.run_id }}
          path: ${{ runner.temp }}/group
          retention-days: 7

  propose:
    needs: group
    outputs:
      closed: ${{ steps.propose.outputs.closed }}
    # After the grouping of this run, or, with `grouping_run`, of that earlier run (group is skipped).
    if: >-
      !cancelled() && (needs.group.result == 'success' || (needs.group.result == 'skipped'
      && inputs.grouping_run != '' && github.ref == 'refs/heads/main' && inputs.live))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read  # with grouping_run: the artifacts of that run
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5  # no cache in a job that reads artifacts
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-referee.txt -r requirements-fetch.txt
      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium
      - name: The earlier run of the grouping
        if: inputs.grouping_run != ''
        env:
          GROUPING_RUN: ${{ inputs.grouping_run }}
        run: |
          if ! [[ "$GROUPING_RUN" =~ ^[0-9]{1,20}$ ]]; then
            echo "::error::grouping_run is not a run id: $GROUPING_RUN" >&2
            exit 1
          fi
          echo "The grouping of run $GROUPING_RUN, not grouped again" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        if: inputs.grouping_run == ''
        with:
          name: import-group-${{ github.run_id }}
          path: ${{ runner.temp }}/group
      - uses: actions/download-artifact@v4
        if: inputs.grouping_run != ''
        with:
          name: import-group-${{ inputs.grouping_run }}
          path: ${{ runner.temp }}/group
          run-id: ${{ inputs.grouping_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4  # results.jsonl: the reasons of the grouping (TAX-44)
        if: inputs.grouping_run != ''
        with:
          pattern: referee-run-*-import-group-*
          path: ${{ runner.temp }}/group-run
          run-id: ${{ inputs.grouping_run }}
          github-token: ${{ github.token }}
      - name: Read the pages and run the gate (no key)
        id: propose
        env:
          SUBMITTER: ${{ inputs.submitter }}  # checked as an account name by tools/intake.py
          GROUPING_RUN: ${{ inputs.grouping_run }}
        run: |
          set -euo pipefail
          list=$(.github/scripts/import-found.sh "$FOUND")  # stops the step on a wrong input
          mapfile -t files <<< "$list"
          reasons=()
          if [ -n "$GROUPING_RUN" ]; then
            mapfile -t results < <(find "$RUNNER_TEMP/group-run" -name results.jsonl)
            if [ "${#results[@]}" -ne 1 ]; then
              echo "::error::run $GROUPING_RUN has ${#results[@]} results.jsonl of the grouping, not one" >&2
              exit 1
            fi
            reasons=(--group-results "${results[0]}")
          fi
          python tools/importer.py propose --found "${files[@]}" --classes "$RUNNER_TEMP/group/classes.json" \
            --names "$RUNNER_TEMP/group/names.json" "${reasons[@]}" --fetch --browser --gated "$RUNNER_TEMP/proposed/gated.json" \
            --submitter "$SUBMITTER" \
            --out "$RUNNER_TEMP/proposed" > propose.log
          sed -n '/^# Importer/,$p' propose.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: import-proposed-${{ github.run_id }}
          path: ${{ runner.temp }}/proposed
          retention-days: 30

  search:
    needs: [group, propose]
    if: >-
      !cancelled() && needs.propose.result == 'success' && needs.propose.outputs.closed != '0'
      && needs.propose.outputs.closed != '' && github.ref == 'refs/heads/main' && inputs.live
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: referee
    concurrency:
      group: referee-judge  # one paid job at a time, so the budget cannot be spent twice
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read  # earlier runs, for the budget
    outputs:
      cost: ${{ steps.search.outputs.cost }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5  # no cache in a job that reads artifacts
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-referee.txt
      - name: Gather earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/gather-runs.sh
      - uses: actions/download-artifact@v4
        with:
          name: import-proposed-${{ github.run_id }}
          path: ${{ runner.temp }}/proposed
      - name: One search per closed page (TAX-49), no page is read here
        id: search
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAP: ${{ inputs.budget }}
          GROUP_COST: ${{ needs.group.outputs.cost }}  # empty with grouping_run: paid in that run
          MODEL: ${{ vars.REFEREE_MODEL || 'claude-opus-5-5' }}
          BUDGET: ${{ vars.REFEREE_BUDGET || '50.00' }}
        run: |
          set -euo pipefail
          left=$(python - <<'PY'
          import os
          print(f"{max(float(os.environ['CAP']) - float(os.environ.get('GROUP_COST') or 0), 0):.4f}")
          PY
          )
          python tools/importer.py search --closed "$RUNNER_TEMP/proposed/closed.json" --output search/search.json \
            --live --model "$MODEL" --budget "$BUDGET" --cap "$left" | tee search.log
          { echo "### Search for closed pages"; echo; cat search.log; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the run
        if: always() && steps.search.outputs.run_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: referee-run-${{ steps.search.outputs.run_name }}
          path: ${{ steps.search.outputs.run_dir }}
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: import-search-${{ github.run_id }}
          path: search/
          retention-days: 7

  reread:
    needs: [propose, search]
    if: ${{ !cancelled() && needs.search.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read  # with grouping_run: the artifacts of that run
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5  # no cache in a job that reads artifacts
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-referee.txt -r requirements-fetch.txt
      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        if: inputs.grouping_run == ''
        with:
          name: import-group-${{ github.run_id }}
          path: ${{ runner.temp }}/group
      - uses: actions/download-artifact@v4
        if: inputs.grouping_run != ''
        with:
          name: import-group-${{ inputs.grouping_run }}
          path: ${{ runner.temp }}/group
          run-id: ${{ inputs.grouping_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.grouping_run != ''
        with:
          pattern: referee-run-*-import-group-*
          path: ${{ runner.temp }}/group-run
          run-id: ${{ inputs.grouping_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: import-proposed-${{ github.run_id }}
          path: ${{ runner.temp }}/first
      - uses: actions/download-artifact@v4
        with:
          name: import-search-${{ github.run_id }}
          path: ${{ runner.temp }}/search
      - name: Read what the search found, and run the gate again (no key)
        env:
          SUBMITTER: ${{ inputs.submitter }}  # checked as an account name by tools/intake.py
          GROUPING_RUN: ${{ inputs.grouping_run }}
        run: |
          set -euo pipefail
          list=$(.github/scripts/import-found.sh "$FOUND")  # stops the step on a wrong input
          mapfile -t files <<< "$list"
          reasons=()
          if [ -n "$GROUPING_RUN" ]; then
            mapfile -t results < <(find "$RUNNER_TEMP/group-run" -name results.jsonl)
            if [ "${#results[@]}" -ne 1 ]; then
              echo "::error::run $GROUPING_RUN has ${#results[@]} results.jsonl of the grouping, not one" >&2
              exit 1
            fi
            reasons=(--group-results "${results[0]}")
          fi
          python tools/importer.py propose --found "${files[@]}" --classes "$RUNNER_TEMP/group/classes.json" \
            --names "$RUNNER_TEMP/group/names.json" "${reasons[@]}" --fetch --browser --gated "$RUNNER_TEMP/proposed/gated.json" \
            --submitter "$SUBMITTER" --sources "$RUNNER_TEMP/first/sources.json" --search "$RUNNER_TEMP/search/search.json" \
            --out "$RUNNER_TEMP/proposed" > propose.log
          sed -n '/^# Importer/,$p' propose.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: import-proposed-${{ github.run_id }}  # replaces the artifact of propose
          path: ${{ runner.temp }}/proposed
          retention-days: 30
          overwrite: true

  judge:
    needs: [group, propose, search, reread]
    # search and reread run only for closed pages; skipped, the artifact of propose stands
    if: ${{ !cancelled() && needs.propose.result == 'success' && needs.search.result != 'failure' && needs.reread.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: referee
    concurrency:
      group: referee-judge
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read  # earlier runs, for the ceilings
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5  # no cache in a job that reads artifacts
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-referee.txt
      - name: Gather earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/gather-runs.sh
      - uses: actions/download-artifact@v4
        with:
          name: import-proposed-${{ github.run_id }}
          path: ${{ runner.temp }}/proposed
      - name: Judge what the gate left, as one batch
        id: judge
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAP: ${{ inputs.budget }}
          GROUP_COST: ${{ needs.group.outputs.cost }}  # empty with grouping_run: paid in that run
          SEARCH_COST: ${{ needs.search.outputs.cost }}  # empty without closed pages
          MODEL: ${{ vars.REFEREE_MODEL || 'claude-opus-5-5' }}
          EFFORT: ${{ vars.REFEREE_EFFORT || 'low' }}
          BUDGET: ${{ vars.REFEREE_BUDGET || '50.00' }}
        run: |
          set -euo pipefail
          left=$(python - <<'PY'
          import os
          spent = float(os.environ.get('GROUP_COST') or 0) + float(os.environ.get('SEARCH_COST') or 0)
          print(f"{max(float(os.environ['CAP']) - spent, 0):.4f}")
          PY
          )
          echo "What the grouping and the search left of the cap: \$$left" | tee -a "$GITHUB_STEP_SUMMARY"
          python tools/pr_referee.py judge --gated "$RUNNER_TEMP/proposed/gated.json" --output verdicts --live \
            --model "$MODEL" --effort "$EFFORT" --pr-cap "$left" --budget "$BUDGET"
          cat verdicts/comment.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.judge.outcome == 'success'
        with:
          name: import-verdicts-${{ github.run_id }}
          path: verdicts/
          retention-days: 90
      - name: Keep the run
        if: always() && steps.judge.outputs.run_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: referee-run-${{ steps.judge.outputs.run_name }}
          path: ${{ steps.judge.outputs.run_dir }}
          retention-days: 90

  pull-request:
    needs: judge
    if: ${{ !cancelled() && needs.judge.result == 'success' }}  # group may be skipped (grouping_run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # the branch
      pull-requests: write  # the pull request
    steps:
      - uses: actions/checkout@v4  # main, with the token to push a branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: import-proposed-${{ github.run_id }}
          path: ${{ runner.temp }}/proposed
      - uses: actions/download-artifact@v4
        with:
          name: import-verdicts-${{ github.run_id }}
          path: ${{ runner.temp }}/verdicts
      - name: The outcome on a branch, and a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DATA: ${{ runner.temp }}/proposed/data
          VERDICTS: ${{ runner.temp }}/verdicts
          REPORT: ${{ runner.temp }}/proposed/report.md
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # The count per product after the verdict (TAX-39), against the data of main, before anything changes.
          python tools/importer.py count --outcomes "$RUNNER_TEMP/proposed/outcomes.json" \
            --verdicts "$VERDICTS/verdicts.json" --out "$RUNNER_TEMP/count.md" > /dev/null
          cat "$RUNNER_TEMP/count.md" >> "$GITHUB_STEP_SUMMARY"
          # Only data files and the parking list come over; then the verdicts take out what is not accepted.
          for d in products publishers; do
            if [ -d "$DATA/$d" ]; then cp -R "$DATA/$d" .; fi
          done
          cp "$DATA/referee/parked.yaml" referee/parked.yaml
          python tools/pr_referee.py apply "$VERDICTS/verdicts.json" --root .
          python tools/lint.py
          list=$(.github/scripts/import-found.sh "$FOUND")  # stops the step on a wrong input
          mapfile -t files <<< "$list"
          names=$(printf '%s ' "${files[@]##*/}")
          branch="import/kev-ronde-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add products publishers referee/parked.yaml
          git commit -q -m "TAX-27: the KEV round, ${names% } (run ${RUN_ID})"
          git push -q origin "$branch"
          { echo "KEV round (TAX-27), ${names% }, workflow run ${RUN_ID}. Not merged by itself."; echo
            cat "$RUNNER_TEMP/count.md"; echo; cat "$VERDICTS/comment.md"; echo; cat "$REPORT"; } | head -c 60000 > body.md
          if ! gh pr create --base main --head "$branch" --title "TAX-27: KEV round, ${names% }" --body-file body.md \
               | tee -a "$GITHUB_STEP_SUMMARY"; then
            # The repository may not let a workflow open a pull request: the branch is there, open it by hand.
            echo "Open the pull request by hand: https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
