name: lint

on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "CHANGELOG.md"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "CHANGELOG.md"]

permissions:
  contents: read

# One run per branch or pull request: a new push cancels the run still going (the Actions minutes
# of the account are shared, 18 November 2026).
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the base of a pull request, to list its changed files
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-referee.txt
      - name: Tests of the lint and the referee harness
        run: python -m unittest discover -s tests -v
      - name: Lint the data (writing rule, TE1, TK2 and TK3)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # On a pull request: findings only on its own data files, compared with the whole dataset (TAX-16).
          # The whole dataset when the rules themselves change, or a data file is deleted or renamed
          # (that can break a file the pull request did not touch). On main: always the whole dataset.
          if [ -n "$BASE" ]; then
            git diff --name-only --diff-filter=AM "$BASE"...HEAD > changed.txt
            if git diff --name-only "$BASE"...HEAD | grep -qE '^(schema/|tools/lint\.py|tools/keyrule\.py)' \
               || git diff --name-only --diff-filter=DR "$BASE"...HEAD | grep -qE '^(products|publishers)/'; then
              echo "The rules changed, or a data file was deleted or renamed: the whole dataset."
              python tools/lint.py
            else
              python tools/lint.py --changed changed.txt
            fi
          else
            python tools/lint.py
          fi

