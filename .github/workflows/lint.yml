name: lint

on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "CHANGELOG.md"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "CHANGELOG.md"]

permissions:
  contents: read

# One run per branch or pull request: a new push cancels the run still going (the Actions minutes
# of the account are shared, 18 November 2026).
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the base of a pull request, to list its changed files
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-referee.txt
      - name: Tests of the lint and the referee harness
        run: python -m unittest discover -s tests -v
      - name: Lint the data (writing rule, TE1, TK2 and TK3)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # On a pull request: findings only on its own data files, compared with the whole dataset (TAX-16).
          # A deleted data file can break only a product whose publisher file is gone (TE1): those products
          # are linted too, not the whole dataset, which takes over 10 minutes for the lookalikes (TV3) alone.
          # A rename counts as a deletion and an addition. The whole dataset when the rules themselves change.
          # On main: always the whole dataset.
          if [ -n "$BASE" ]; then
            git diff --no-renames --name-only --diff-filter=AM "$BASE"...HEAD > changed.txt
            if git diff --name-only "$BASE"...HEAD | grep -qE '^(schema/|tools/lint\.py|tools/keyrule\.py)'; then
              echo "The rules changed: the whole dataset."
              python tools/lint.py
            else
              for pub in $(git diff --no-renames --name-only --diff-filter=D "$BASE"...HEAD \
                           | sed -n 's|^publishers/\(.*\)\.yaml$|\1|p'); do
                echo "Publisher $pub deleted: its products are linted too."
                grep -rlE "^publisher: ['\"]?$pub['\"]?$" products >> changed.txt || true
              done
              python tools/lint.py --changed changed.txt
            fi
          else
            python tools/lint.py
          fi
