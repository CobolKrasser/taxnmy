name: referee-models

# The model measurement of TAX-18: the test set, effort low, as a batch, three runs per model
# (Haiku 5.5 and Sonnet 5.5), on the sources of run A2, compared with A2. Started by hand from main.
# No web search, no web fetch: the sources come from the artifact of A2.
#
# The key is in environment referee: Fred approves each run, also the free token count.
# The budget is a hard limit in code: --budget 13.70 is the $20 of fase 2, of which $10.70 is spent,
# so this measurement can spend at most $3.00. The probe measures three cases per model first and
# stops the measurement when the extrapolated total would pass the budget.

on:
  workflow_dispatch:
    inputs:
      live:
        description: "measure (costs money, about $2.70); off: an estimate"
        type: boolean
        default: false
      count:
        description: "with live off: count the input tokens with the API (free)"
        type: boolean
        default: true
      models:
        type: string
        default: "claude-haiku-5-5 claude-sonnet-5-5"
      repeats:
        type: string
        default: "3"
      effort:
        type: choice
        options: [low, medium, high]
        default: low
      budget:
        description: "dollars, for all runs together (hard limit); 13.70 leaves $3.00"
        type: string
        default: "13.70"
      sources_run:
        description: "the run whose artifact referee-sources-final-<run> holds the sources (A2)"
        type: string
        default: "43462875320"

permissions:
  contents: read

concurrency:
  group: referee-judge  # one paid job at a time, so the budget cannot be spent twice
  cancel-in-progress: false

jobs:
  measure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: referee
    permissions:
      contents: read
      actions: read  # earlier runs, and the sources of A2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5  # no cache in a job that reads artifacts
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-referee.txt
      - name: Gather earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/gather-runs.sh
      - name: Get the sources of A2
        uses: actions/download-artifact@v4
        with:
          name: referee-sources-final-${{ inputs.sources_run }}
          path: ${{ runner.temp }}/fetched  # outside the checkout
          run-id: ${{ inputs.sources_run }}
          github-token: ${{ github.token }}
      - name: Measure
        id: measure
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODELS: ${{ inputs.models }}
          REPEATS: ${{ inputs.repeats }}
          EFFORT: ${{ inputs.effort }}
          BUDGET: ${{ inputs.budget }}
          LIVE: ${{ inputs.live }}
          COUNT: ${{ inputs.count }}
          FETCHED: ${{ runner.temp }}/fetched
        run: |
          set -euo pipefail
          read -r -a models <<< "$MODELS"
          args=(measure --models "${models[@]}" --repeats "$REPEATS" --effort "$EFFORT" --budget "$BUDGET"
                --sources "$FETCHED/sources.json")
          if [ "$LIVE" = "true" ]; then args+=(--live); elif [ "$COUNT" = "true" ]; then args+=(--count); fi
          python tools/referee.py "${args[@]}" | tee measure.log
          sed -n '/^| model/,$p' measure.log >> "$GITHUB_STEP_SUMMARY"
      - name: Keep run 1
        if: always() && steps.measure.outputs.dir_1 != ''
        uses: actions/upload-artifact@v4
        with:
          name: referee-run-${{ steps.measure.outputs.name_1 }}
          path: ${{ steps.measure.outputs.dir_1 }}
          retention-days: 90
      - name: Keep run 2
        if: always() && steps.measure.outputs.dir_2 != ''
        uses: actions/upload-artifact@v4
        with:
          name: referee-run-${{ steps.measure.outputs.name_2 }}
          path: ${{ steps.measure.outputs.dir_2 }}
          retention-days: 90
      - name: Keep run 3
        if: always() && steps.measure.outputs.dir_3 != ''
        uses: actions/upload-artifact@v4
        with:
          name: referee-run-${{ steps.measure.outputs.name_3 }}
          path: ${{ steps.measure.outputs.dir_3 }}
          retention-days: 90
      - name: Keep run 4
        if: always() && steps.measure.outputs.dir_4 != ''
        uses: actions/upload-artifact@v4
        with:
          name: referee-run-${{ steps.measure.outputs.name_4 }}
          path: ${{ steps.measure.outputs.dir_4 }}
          retention-days: 90
      - name: Keep run 5
        if: always() && steps.measure.outputs.dir_5 != ''
        uses: actions/upload-artifact@v4
        with:
          name: referee-run-${{ steps.measure.outputs.name_5 }}
          path: ${{ steps.measure.outputs.dir_5 }}
          retention-days: 90
      - name: Keep run 6
        if: always() && steps.measure.outputs.dir_6 != ''
        uses: actions/upload-artifact@v4
        with:
          name: referee-run-${{ steps.measure.outputs.name_6 }}
          path: ${{ steps.measure.outputs.dir_6 }}
          retention-days: 90
      - name: Keep run 7
        if: always() && steps.measure.outputs.dir_7 != ''
        uses: actions/upload-artifact@v4
        with:
          name: referee-run-${{ steps.measure.outputs.name_7 }}
          path: ${{ steps.measure.outputs.dir_7 }}
          retention-days: 90
      - name: Keep run 8
        if: always() && steps.measure.outputs.dir_8 != ''
        uses: actions/upload-artifact@v4
        with:
          name: referee-run-${{ steps.measure.outputs.name_8 }}
          path: ${{ steps.measure.outputs.dir_8 }}
          retention-days: 90
      - name: Keep the report
        if: always() && steps.measure.outputs.report != ''
        uses: actions/upload-artifact@v4
        with:
          name: referee-models-report-${{ github.run_id }}
          path: ${{ steps.measure.outputs.report }}
          retention-days: 90
