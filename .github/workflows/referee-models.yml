name: referee-models

# The model measurement of TAX-18: the test set as a batch, per stand (a model at an effort), three
# runs per stand, compared with run A2. Started by hand. No web search: the sources of A2 come from
# its artifact, and job sources reads only those of the cases A2 did not have (TAX-24, TAX-18).
#
# Two jobs, so that the key never comes near code from other sites:
#   sources  keeps the sources of A2 and fetches what they lack, with the ladder (steps 0-3) and a
#            headless browser. No key. It may run from any branch: that is free.
#   measure  the estimate (live off) or the measurement (live on). Key in environment referee:
#            a maintainer approves each run, also the free token count. Main only.
#
# The budget is a hard limit in code, for every run together: $50 (17 November 2026; it was
# $20). About $13.15 is spent. The probe measures three cases per stand first and stops the
# measurement when the extrapolated total would pass the budget. Sonnet 5.5 at low and at medium,
# three runs each, is estimated at about $6.

on:
  workflow_dispatch:
    inputs:
      live:
        description: "measure (costs money, about $6 for Sonnet at low and medium); off: an estimate"
        type: boolean
        default: false
      count:
        description: "with live off: count the input tokens with the API (free)"
        type: boolean
        default: true
      models:
        type: string
        default: "claude-opus-5-5"
      efforts:
        description: "one stand per model and effort (low, medium, high), separated by spaces"
        type: string
        default: "low"
      repeats:
        type: string
        default: "3"
      budget:
        description: "dollars, for all runs together (hard limit)"
        type: string
        default: "50.00"
      sources_run:
        description: "the run whose artifact referee-sources-final-<run> holds the sources (A2)"
        type: string
        default: "43462875320"

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read  # the sources of A2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7  # no cache in a job that reads artifacts
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-referee.txt -r requirements-fetch.txt
      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium
      - name: Get the sources of A2
        uses: actions/download-artifact@v8
        with:
          name: referee-sources-final-${{ inputs.sources_run }}
          path: ${{ runner.temp }}/a2  # outside the checkout
          run-id: ${{ inputs.sources_run }}
          github-token: ${{ github.token }}
      - name: Fetch what A2 lacks
        env:
          A2: ${{ runner.temp }}/a2
          OUT: ${{ runner.temp }}/fetched
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python tools/referee.py fetch --base "$A2/sources.json" --output "$OUT/sources.json" | tee "$OUT/log.txt"
          sed -n '/^[0-9]* sources$/,$p' "$OUT/log.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Estimate per stand (from the tokens of A2; no key, nothing sent)
        env:
          MODELS: ${{ inputs.models }}
          EFFORTS: ${{ inputs.efforts }}
          REPEATS: ${{ inputs.repeats }}
          BUDGET: ${{ inputs.budget }}
        run: |
          set -euo pipefail
          read -r -a models <<< "$MODELS"
          read -r -a efforts <<< "$EFFORTS"
          python tools/referee.py measure --models "${models[@]}" --efforts "${efforts[@]}" --repeats "$REPEATS" \
            --budget "$BUDGET" --out "$RUNNER_TEMP/no-runs" | tee estimate.log
          { echo "Estimate from the tokens of A2; the budget left is counted in job measure."; echo
            sed -n '/^| model |/,$p' estimate.log; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the sources
        uses: actions/upload-artifact@v7
        with:
          name: referee-sources-measure-${{ github.run_id }}
          path: ${{ runner.temp }}/fetched/sources.json
          retention-days: 90

  measure:
    needs: sources
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: referee
    concurrency:
      group: referee-judge  # one paid job at a time, so the budget cannot be spent twice
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read  # earlier runs, and the sources of job sources
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7  # no cache in a job that reads artifacts
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-referee.txt
      - name: Gather earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/gather-runs.sh
      - name: Get the sources
        uses: actions/download-artifact@v8
        with:
          name: referee-sources-measure-${{ github.run_id }}
          path: ${{ runner.temp }}/fetched  # outside the checkout
      - name: Measure
        id: measure
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODELS: ${{ inputs.models }}
          EFFORTS: ${{ inputs.efforts }}
          REPEATS: ${{ inputs.repeats }}
          BUDGET: ${{ inputs.budget }}
          LIVE: ${{ inputs.live }}
          COUNT: ${{ inputs.count }}
          FETCHED: ${{ runner.temp }}/fetched
        run: |
          set -euo pipefail
          read -r -a models <<< "$MODELS"
          read -r -a efforts <<< "$EFFORTS"
          args=(measure --models "${models[@]}" --efforts "${efforts[@]}" --repeats "$REPEATS" --budget "$BUDGET"
                --sources "$FETCHED/sources.json")
          if [ "$LIVE" = "true" ]; then args+=(--live); elif [ "$COUNT" = "true" ]; then args+=(--count); fi
          python tools/referee.py "${args[@]}" | tee measure.log
          sed -n '/^| \(model\|stand\) |/,$p' measure.log >> "$GITHUB_STEP_SUMMARY"
      - name: Keep run 1
        if: always() && steps.measure.outputs.dir_1 != ''
        uses: actions/upload-artifact@v7
        with:
          name: referee-run-${{ steps.measure.outputs.name_1 }}
          path: ${{ steps.measure.outputs.dir_1 }}
          retention-days: 90
      - name: Keep run 2
        if: always() && steps.measure.outputs.dir_2 != ''
        uses: actions/upload-artifact@v7
        with:
          name: referee-run-${{ steps.measure.outputs.name_2 }}
          path: ${{ steps.measure.outputs.dir_2 }}
          retention-days: 90
      - name: Keep run 3
        if: always() && steps.measure.outputs.dir_3 != ''
        uses: actions/upload-artifact@v7
        with:
          name: referee-run-${{ steps.measure.outputs.name_3 }}
          path: ${{ steps.measure.outputs.dir_3 }}
          retention-days: 90
      - name: Keep run 4
        if: always() && steps.measure.outputs.dir_4 != ''
        uses: actions/upload-artifact@v7
        with:
          name: referee-run-${{ steps.measure.outputs.name_4 }}
          path: ${{ steps.measure.outputs.dir_4 }}
          retention-days: 90
      - name: Keep run 5
        if: always() && steps.measure.outputs.dir_5 != ''
        uses: actions/upload-artifact@v7
        with:
          name: referee-run-${{ steps.measure.outputs.name_5 }}
          path: ${{ steps.measure.outputs.dir_5 }}
          retention-days: 90
      - name: Keep run 6
        if: always() && steps.measure.outputs.dir_6 != ''
        uses: actions/upload-artifact@v7
        with:
          name: referee-run-${{ steps.measure.outputs.name_6 }}
          path: ${{ steps.measure.outputs.dir_6 }}
          retention-days: 90
      - name: Keep run 7
        if: always() && steps.measure.outputs.dir_7 != ''
        uses: actions/upload-artifact@v7
        with:
          name: referee-run-${{ steps.measure.outputs.name_7 }}
          path: ${{ steps.measure.outputs.dir_7 }}
          retention-days: 90
      - name: Keep run 8
        if: always() && steps.measure.outputs.dir_8 != ''
        uses: actions/upload-artifact@v7
        with:
          name: referee-run-${{ steps.measure.outputs.name_8 }}
          path: ${{ steps.measure.outputs.dir_8 }}
          retention-days: 90
      - name: Keep the report
        if: always() && steps.measure.outputs.report != ''
        uses: actions/upload-artifact@v7
        with:
          name: referee-models-report-${{ github.run_id }}
          path: ${{ steps.measure.outputs.report }}
          retention-days: 90
