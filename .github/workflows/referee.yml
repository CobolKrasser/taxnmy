name: referee

# A measurement of the AI referee (fase 2). Started by hand.
#
# Four jobs, so that the key never comes near code from other sites (hosting plan §8;
# tax-fase2-pagina-s-lezen.md §4; tax-weigerende-sites.md §4):
#   fetch    reads the sources with the ladder (steps 0-3), including a headless browser that
#            runs the JavaScript of those sites. No key. Keeps sources.json as an artifact.
#            It may run from any branch, which is how the ladder is tested for free.
#   search   step 4: one web search per refused source, on the publisher's domains. Key, no
#            browser; main only, live only. Counts against the budget.
#   refetch  reads the URLs that search found, down steps 1-3. No key.
#   judge    reads the sources and calls the referee. Key, no browser; main only.

on:
  workflow_dispatch:
    inputs:
      task:
        description: "measure, or check-urls (fetch the verify URLs; free)"
        type: choice
        options: [measure, check-urls]
        default: measure
      condition:
        description: "fetched (base run), memory or web (TE4)"
        type: choice
        options: [fetched, memory, web]
        default: fetched
      cases:
        description: "case ids separated by spaces, or all; empty: all for fetched, the 29 TE4 cases otherwise"
        type: string
        default: ""
      limit:
        description: "only the first N cases (empty: no limit)"
        type: string
        default: ""
      model:
        type: string
        default: claude-opus-5-5
      effort:
        type: choice
        options: [low, medium, high]
        default: medium
      budget:
        description: "dollars, for all runs together (hard limit)"
        type: string
        default: "50.00"
      live:
        description: "call the API (costs money); off is a dry run"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: referee  # one measurement at a time, so the budget cannot be spent twice
  cancel-in-progress: false

jobs:
  fetch:
    if: inputs.task == 'check-urls' || inputs.condition == 'fetched'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-referee.txt -r requirements-fetch.txt
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-fetch.txt') }}
      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium

      - name: Test the browser step
        env:
          TAXNMY_BROWSER_TEST: "1"
        run: python -m unittest tests.test_fetch -v

      - name: Check the verify URLs
        if: inputs.task == 'check-urls'
        run: python tools/referee.py check-urls | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fetch the sources
        if: inputs.task == 'measure'
        env:
          CASES: ${{ inputs.cases }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          mkdir -p fetched
          args=(fetch --output fetched/sources.json)
          if [ -n "$CASES" ]; then read -r -a ids <<< "$CASES"; args+=(--cases "${ids[@]}"); fi
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          python tools/referee.py "${args[@]}" | tee fetched/log.txt
          sed -n '/^[0-9]* sources$/,$p' fetched/log.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the sources
        if: inputs.task == 'measure'
        uses: actions/upload-artifact@v4
        with:
          name: referee-sources-${{ github.run_id }}
          path: fetched/sources.json
          retention-days: 90

  search:
    needs: fetch
    if: inputs.task == 'measure' && inputs.condition == 'fetched' && inputs.live && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: referee  # the key; Fred approves (hosting-taxnmy-publiek.md §4, point 10)
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      found: ${{ steps.search.outputs.found }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-referee.txt
      - name: Gather earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/gather-runs.sh
      - uses: actions/download-artifact@v4
        with:
          name: referee-sources-${{ github.run_id }}
          path: fetched
      - name: Search for another open source
        id: search
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CASES: ${{ inputs.cases }}
          LIMIT: ${{ inputs.limit }}
          MODEL: ${{ inputs.model }}
          BUDGET: ${{ inputs.budget }}
        run: |
          set -euo pipefail
          args=(search --sources fetched/sources.json --output fetched/search.json --budget "$BUDGET" --live)
          if [ -n "$CASES" ]; then read -r -a ids <<< "$CASES"; args+=(--cases "${ids[@]}"); fi
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          python tools/referee.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$(python -c 'import json; print(bool(json.load(open("fetched/search.json"))))')" = "True" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Keep what was found
        uses: actions/upload-artifact@v4
        with:
          name: referee-search-${{ github.run_id }}
          path: fetched/search.json
          retention-days: 90
      - name: Keep the search run
        if: always() && steps.search.outputs.run_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: referee-run-${{ steps.search.outputs.run_name }}
          path: ${{ steps.search.outputs.run_dir }}
          retention-days: 90

  refetch:
    needs: [fetch, search]
    if: needs.search.result == 'success' && needs.search.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-referee.txt -r requirements-fetch.txt
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-fetch.txt') }}
      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: referee-sources-${{ github.run_id }}
          path: fetched
      - uses: actions/download-artifact@v4
        with:
          name: referee-search-${{ github.run_id }}
          path: fetched
      - name: Read what was found
        run: |
          set -euo pipefail
          python tools/referee.py fetch --sources fetched/sources.json --search fetched/search.json \
            --output fetched/final/sources.json | tee fetched/log.txt
          sed -n '/^[0-9]* sources$/,$p' fetched/log.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: referee-sources-final-${{ github.run_id }}
          path: fetched/final/sources.json
          retention-days: 90

  judge:
    needs: [fetch, search, refetch]
    if: >-
      always() && inputs.task == 'measure' && github.ref == 'refs/heads/main' &&
      (needs.fetch.result == 'success' || needs.fetch.result == 'skipped') &&
      (needs.search.result == 'success' || needs.search.result == 'skipped') &&
      (needs.refetch.result == 'success' || needs.refetch.result == 'skipped')
    runs-on: ubuntu-latest
    environment: referee  # the key; Fred approves
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-referee.txt

      - name: Gather earlier runs, the search of this run included
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/gather-runs.sh

      - name: Get the sources
        if: inputs.condition == 'fetched' && needs.refetch.result != 'success'
        uses: actions/download-artifact@v4
        with:
          name: referee-sources-${{ github.run_id }}
          path: fetched
      - name: Get the sources, with what step 4 found
        if: inputs.condition == 'fetched' && needs.refetch.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: referee-sources-final-${{ github.run_id }}
          path: fetched

      - name: Measure
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ inputs.live && secrets.ANTHROPIC_API_KEY || '' }}
          CONDITION: ${{ inputs.condition }}
          CASES: ${{ inputs.cases }}
          LIMIT: ${{ inputs.limit }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
          BUDGET: ${{ inputs.budget }}
          LIVE: ${{ inputs.live }}
        run: |
          set -euo pipefail
          args=(run --condition "$CONDITION" --model "$MODEL" --effort "$EFFORT" --budget "$BUDGET")
          if [ "$CONDITION" = "fetched" ]; then args+=(--sources fetched/sources.json); fi
          if [ -n "$CASES" ]; then read -r -a ids <<< "$CASES"; args+=(--cases "${ids[@]}"); fi
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          if [ "$LIVE" = "true" ]; then args+=(--live); fi
          python tools/referee.py "${args[@]}"

      - name: Summary
        if: always() && steps.run.outputs.run_dir != ''
        run: cat "${{ steps.run.outputs.run_dir }}/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the run
        if: always() && steps.run.outputs.run_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: referee-run-${{ steps.run.outputs.run_name }}
          path: ${{ steps.run.outputs.run_dir }}
          retention-days: 90
