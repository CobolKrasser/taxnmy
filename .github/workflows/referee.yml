name: referee

# A measurement of the AI referee (fase 2). Started by hand.
#
# Two jobs, so that the key never comes near code from other sites (hosting plan §8;
# tax-fase2-pagina-s-lezen.md §4):
#   fetch  reads the sources with the ladder, including a headless browser that runs the
#          JavaScript of those sites. It has no key. It keeps sources.json as an artifact.
#          It may run from any branch, which is how the ladder is tested for free.
#   judge  reads that sources.json and calls the referee. Only this job gets the key, only on a
#          live run, and only from main. It runs no browser and no code from a pull request.

on:
  workflow_dispatch:
    inputs:
      task:
        description: "measure, or check-urls (fetch the verify URLs; free)"
        type: choice
        options: [measure, check-urls]
        default: measure
      condition:
        description: "fetched (base run), memory or web (R13)"
        type: choice
        options: [fetched, memory, web]
        default: fetched
      cases:
        description: "case ids separated by spaces, or all; empty: all for fetched, the 29 R13 cases otherwise"
        type: string
        default: ""
      limit:
        description: "only the first N cases (empty: no limit)"
        type: string
        default: ""
      model:
        type: string
        default: claude-opus-5-5
      effort:
        type: choice
        options: [low, medium, high]
        default: medium
      budget:
        description: "dollars, for all runs together (hard limit)"
        type: string
        default: "20.00"
      live:
        description: "call the API (costs money); off is a dry run"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: referee  # one measurement at a time, so the budget cannot be spent twice
  cancel-in-progress: false

jobs:
  fetch:
    if: inputs.task == 'check-urls' || inputs.condition == 'fetched'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-referee.txt -r requirements-fetch.txt
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-fetch.txt') }}
      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium

      - name: Test the browser step
        env:
          TAXNMY_BROWSER_TEST: "1"
        run: python -m unittest tests.test_fetch -v

      - name: Check the verify URLs
        if: inputs.task == 'check-urls'
        run: python tools/referee.py check-urls | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fetch the sources
        if: inputs.task == 'measure'
        env:
          CASES: ${{ inputs.cases }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          mkdir -p fetched
          args=(fetch --output fetched/sources.json)
          if [ -n "$CASES" ]; then read -r -a ids <<< "$CASES"; args+=(--cases "${ids[@]}"); fi
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          python tools/referee.py "${args[@]}" | tee fetched/log.txt
          sed -n '/^[0-9]* sources$/,$p' fetched/log.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the sources
        if: inputs.task == 'measure'
        uses: actions/upload-artifact@v4
        with:
          name: referee-sources-${{ github.run_id }}
          path: fetched/sources.json
          retention-days: 90

  judge:
    needs: fetch
    if: >-
      always() && inputs.task == 'measure' && github.ref == 'refs/heads/main' &&
      (needs.fetch.result == 'success' || needs.fetch.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-referee.txt

      # The budget counts every earlier run: the ones committed in referee/runs/ and the ones
      # kept as artifacts of this workflow. An expired artifact whose run is not committed would
      # make the count too low, so the measurement stops if there is one.
      - name: Gather earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p referee/runs
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("referee-run-")) | "\(.id) \(.expired) \(.name)"' |
          while read -r id expired name; do
            dir="referee/runs/${name#referee-run-}"
            if [ -e "$dir" ]; then continue; fi
            if [ "$expired" = "true" ]; then
              echo "::error::Run ${name#referee-run-} has expired and is not committed; its cost cannot be counted"
              exit 1
            fi
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > /tmp/run.zip
            mkdir -p "$dir"
            unzip -q /tmp/run.zip -d "$dir"
          done
          ls referee/runs

      - name: Get the sources
        if: inputs.condition == 'fetched'
        uses: actions/download-artifact@v4
        with:
          name: referee-sources-${{ github.run_id }}
          path: fetched

      - name: Measure
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ inputs.live && secrets.ANTHROPIC_API_KEY || '' }}
          CONDITION: ${{ inputs.condition }}
          CASES: ${{ inputs.cases }}
          LIMIT: ${{ inputs.limit }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
          BUDGET: ${{ inputs.budget }}
          LIVE: ${{ inputs.live }}
        run: |
          set -euo pipefail
          args=(run --condition "$CONDITION" --model "$MODEL" --effort "$EFFORT" --budget "$BUDGET")
          if [ "$CONDITION" = "fetched" ]; then args+=(--sources fetched/sources.json); fi
          if [ -n "$CASES" ]; then read -r -a ids <<< "$CASES"; args+=(--cases "${ids[@]}"); fi
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          if [ "$LIVE" = "true" ]; then args+=(--live); fi
          python tools/referee.py "${args[@]}"

      - name: Summary
        if: always() && steps.run.outputs.run_dir != ''
        run: cat "${{ steps.run.outputs.run_dir }}/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the run
        if: always() && steps.run.outputs.run_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: referee-run-${{ steps.run.outputs.run_name }}
          path: ${{ steps.run.outputs.run_dir }}
          retention-days: 90
