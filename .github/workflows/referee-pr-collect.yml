name: referee-pr-collect

# The first half of the referee on a pull request (TAX-17). It runs the code of the pull request,
# so it gets no key and no write access: it only keeps the data files the pull request adds or
# changes as an artifact. The workflow referee-pr reads that artifact, on main, and judges it.
# No pull_request_target.

on:
  pull_request:
    paths:
      - "products/**"
      - "publishers/**"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the base, to list the changed files
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Keep the changed data files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: python tools/pr_referee.py collect --base "$BASE" --head "$HEAD" --pr "$PR" --output pr/proposal.json
      - uses: actions/upload-artifact@v4
        with:
          name: referee-pr-proposal
          path: pr/proposal.json
          retention-days: 7
