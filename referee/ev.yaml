# Electric vehicles as a filler (TAX-59): the data tools/ev.py needs, so that the code names no brand
# and no model (TG4). A maintainer changes it with a pull request.
#
# The models come from Open EV Data (a release on GitHub, CDLA-Permissive-2.0, see NOTICE), from the
# FE Guide of fueleconomy.gov (sheet EV, model years 2026 and 2027) and from the open data of the RDW
# (Gekentekende_voertuigen and its fuel, public domain): the motor vehicles registered in the
# Netherlands that run on electricity only, also mopeds and motorcycles. A trim, a drivetrain or a
# wheel size is a variant of a model (TP3). A model only comes into TAX with a page of the
# manufacturer that publishes its versions (TP1); that page also decides what the product is
# (Fred, 22 and 23 November 2026):
#
#   - the manufacturer publishes one series of versions for several models: those models are one
#     product, with the name the manufacturer gives the series; the model names become aliases;
#   - the manufacturer publishes the versions per model: each model is a product of its own.
#
# `brands`, per brand as Open EV Data writes it:
#   fueleconomy  the names of the brand in the column Division of the FE Guide, when they differ
#   rdw          the names of the brand in the column merk of the RDW, when they differ
#   publisher    {key, name}: the short name of the brand, not that of a legal person (TAX-54)
#   products     each with `name`, `versions` (the page) and `models` (the names the page uses; a row
#                belongs to the model whose words it all has, the longest first). A product with
#                `series: true` is one series for all its models: the models become aliases.
#                A product of which the manufacturer publishes no versions has `updates` instead of
#                `versions`: the page where it says itself that the model gets updates (TP1, TAX-67).
#   apart        the reason when no model of the brand comes in: refuses, none, other or taken; with
#                products, the reason for the models of the brand that no page names
#   others       models of the brand that are models of their own, though a page's model name would
#                catch them (iX1 has all the words of iX): they stay apart
#
# A brand of the RDW that is not among these brands has had no search for a version page: its models stay
# apart with the reason `unsearched`.
#
# The pages of the 12 brands with a source for the versions were read by the builder on 23 November
# 2026; robots.txt allows each of them. The other 59 brands are as the analyst found them (TAX-59,
# comment 12368). The pages of Lotus, Lucid, Changan (Deepal) and Zero Motorcycles were found by the
# prompt for the models of the RDW and read by the analyst on 25 November 2026 (TAX-59, comment 12466).
# The pages with `updates` were found by the two prompts for the models of the RDW; the analyst
# approved 77 rows on 25 November 2026 (TAX-59, comments 12466 and 12471; TAX-67, comment 12472):
# the sporty Audi models are trims of the A6 and Q6 e-tron on the same page (TP3).
version: 1

reasons:
  refuses: "the manufacturer's page refuses our reader (TE5); work for the maintainer"
  none: "the manufacturer publishes no versions (TP1)"
  other: "the version page of the manufacturer does not name the model (TP1)"
  unsearched: "not among the 71 brands of TAX-59: no version page of the manufacturer looked for (TP1)"
  taken: "the key of the publisher is that of another publisher in TAX (TK3); a key for the manufacturer is work for the maintainer"

# The kinds of vehicle of the RDW (voertuigsoort) that are read, and how the round names them.
# `since`: a vehicle first admitted before this year is left out (an old vehicle converted to
# electricity keeps its first date). `at_least`: a trade name with fewer vehicles is left out (a one-off
# import or conversion).
# `implied`: words a row of the RDW has without writing them, since it is fully electric (the RDW writes
# "G80" for the Electrified G80).
rdw:
  since: 2010
  at_least: 10
  implied: [Electric, Electrified]
  kinds:
    Personenauto: car
    Bedrijfsauto: commercial vehicle
    Bus: bus
    Motorfiets: motorcycle
    Motorfiets met zijspan: motorcycle
    Bromfiets: moped
    Driewielig motorrijtuig: three-wheeler
    Motorrijtuig met beperkte snelheid: microcar

