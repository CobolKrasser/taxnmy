# Electric vehicles as a filler (TAX-59): the data tools/ev.py needs, so that the code names no brand
# and no model (TG4). A maintainer changes it with a pull request.
#
# The models come from Open EV Data (a release on GitHub, CDLA-Permissive-2.0, see NOTICE), from the
# FE Guide of fueleconomy.gov (sheet EV, model years 2026 and 2027) and from the open data of the RDW
# (Gekentekende_voertuigen and its fuel, public domain): the motor vehicles registered in the
# Netherlands that run on electricity only, also mopeds and motorcycles. A trim, a drivetrain or a
# wheel size is a variant of a model (TP3). A model only comes into TAX with a page of the
# manufacturer that publishes its versions (TP1); that page also decides what the product is
# (Fred, 22 and 23 November 2026):
#
#   - the manufacturer publishes one series of versions for several models: those models are one
#     product, with the name the manufacturer gives the series; the model names become aliases;
#   - the manufacturer publishes the versions per model: each model is a product of its own.
#
# `brands`, per brand as Open EV Data writes it:
#   fueleconomy  the names of the brand in the column Division of the FE Guide, when they differ
#   rdw          the names of the brand in the column merk of the RDW, when they differ
#   publisher    {key, name}: the short name of the brand, not that of a legal person (TAX-54)
#   products     each with `name`, `versions` (the page) and `models` (the names the page uses; a row
#                belongs to the model whose words it all has, the longest first). A product with
#                `series: true` is one series for all its models: the models become aliases.
#   apart        the reason when no model of the brand comes in: refuses, none or other
#
# A brand of the RDW that is not among these brands has had no search for a version page: its models stay
# apart with the reason `unsearched`.
#
# The pages of the 12 brands with a source for the versions were read by the builder on 23 November
# 2026; robots.txt allows each of them. The other 59 brands are as the analyst found them (TAX-59,
# comment 12368). The pages of Lotus, Lucid, Changan (Deepal) and Zero Motorcycles were found by the
# prompt for the models of the RDW and read by the analyst on 25 November 2026 (TAX-59, comment 12466).
version: 1

reasons:
  refuses: "the manufacturer's page refuses our reader (TE5); work for the maintainer"
  none: "the manufacturer publishes no versions (TP1)"
  other: "the version page of the manufacturer does not name the model (TP1)"
  unsearched: "not among the 71 brands of TAX-59: no version page of the manufacturer looked for (TP1)"

# The kinds of vehicle of the RDW (voertuigsoort) that are read, and how the round names them.
# `since`: a vehicle first admitted before this year is left out (an old vehicle converted to
# electricity keeps its first date). `at_least`: a trade name with fewer vehicles is left out (a one-off
# import or conversion).
# `implied`: words a row of the RDW has without writing them, since it is fully electric (the RDW writes
# "G80" for the Electrified G80).
rdw:
  since: 2010
  at_least: 10
  implied: [Electric, Electrified]
  kinds:
    Personenauto: car
    Bedrijfsauto: commercial vehicle
    Bus: bus
    Motorfiets: motorcycle
    Motorfiets met zijspan: motorcycle
    Bromfiets: moped
    Driewielig motorrijtuig: three-wheeler
    Motorrijtuig met beperkte snelheid: microcar

brands:
  # one series for several models
  Volkswagen:
    rdw: [VW]
    publisher: {key: volkswagen, name: Volkswagen}
    products:
      - name: ID. Software
        series: true
        versions: 'https://www.volkswagen.at/elektroauto/software-und-konnektivitaet/id-software-updates'
        models: [ID.3, ID.4, ID.5, ID.7, ID. Buzz]
  Škoda:
    publisher: {key: skoda, name: Škoda}
    products:
      - name: Škoda Software
        series: true
        versions: 'https://www.skoda-auto.com/emobility/software-update'
        models: [Elroq, Enyaq, Enyaq Coupé]
  Cupra:
    publisher: {key: cupra, name: CUPRA}
    products:
      - name: CUPRA OTA Update
        series: true
        versions: 'https://www.cupra.com/en/owners/ota-updates/updates-electric-vehicles'
        models: [Raval, Born, Tavascan]
  Jaguar:
    publisher: {key: jaguar, name: Jaguar}
    products:
      - name: Jaguar OS
        series: true
        versions: 'https://www.jaguar.com/ownership/software-update.html'
        models: [I-PACE]
  Land Rover:
    publisher: {key: land-rover, name: Land Rover}
    products:
      - name: Land Rover OS
        series: true
        versions: 'https://www.landrover.com/ownership/software-update/index.html'
        models: [Range Rover, Range Rover Sport, Range Rover Velar, Range Rover Evoque]
  XPeng:
    publisher: {key: xpeng, name: XPENG}
    products:
      - name: XOS
        series: true
        versions: 'https://www.xpeng.com/news/0198df0f0bb998ab5d958a02815f00a4'
        models: [G6, G9, G9L, P7, P7+, X9]
  Lotus:
    publisher: {key: lotus, name: Lotus}
    products:
      - name: Lotus Hyper OS
        series: true
        versions: 'https://www.lotuscars.com/en-GB/support/over-the-air-updates/version-history'
        models: [Eletre, Emeya]
  Zero Motorcycles:  # the series is in TAX from CSAF ("Zero Motorcycles firmware"): its models become aliases
    rdw: [ZERO MOTORCYCLES]
    publisher: {key: zero-motorcycles, name: Zero Motorcycles}
    products:
      - name: Zero Motorcycles
        series: true
        versions: 'https://zeromotorcycles.com/firmware'
        models: [DS, DSR, DSR/X, FXE, S, SR, SR/F, SR/S]
  # per model
  Polestar:
    fueleconomy: [Polestar Automotive USA Inc]
    publisher: {key: polestar, name: Polestar}
    products:
      - {name: Polestar 2, versions: 'https://www.polestar.com/uk/manual/polestar-2/2026/software-updates/', models: [Polestar 2]}
      - {name: Polestar 3, versions: 'https://www.polestar.com/uk/manual/polestar-3/2026/software-updates/', models: [Polestar 3]}
      - {name: Polestar 4, versions: 'https://www.polestar.com/uk/manual/polestar-4/2026/software-updates/', models: [Polestar 4]}
      - {name: Polestar 5, versions: 'https://www.polestar.com/uk/manual/polestar-5/2026/software-updates/', models: [Polestar 5]}
  Zeekr:
    publisher: {key: zeekr, name: Zeekr}
    products:
      - {name: 7X, versions: 'https://www.zeekr.eu/ota/software-updatezeekr7x-15', models: [7X]}
  Hyundai:
    fueleconomy: [HYUNDAI MOTOR COMPANY]
    publisher: {key: hyundai, name: Hyundai}
    products:
      - {name: IONIQ 5, versions: &hyundai 'https://www.hyundai.com/au/en/owning/ota-updates', models: [IONIQ 5]}
      - {name: IONIQ 5 N, versions: *hyundai, models: [IONIQ 5 N]}
      - {name: IONIQ 6, versions: *hyundai, models: [IONIQ 6]}
      - {name: KONA Electric, versions: *hyundai, models: [KONA Electric]}
  Genesis:
    publisher: {key: genesis, name: Genesis}
    products:
      - {name: GV60, versions: &genesis 'https://www.genesis.com/kr/en/support/notice.html', models: [GV60]}
      - {name: Electrified G80, versions: *genesis, models: [Electrified G80]}
      - {name: Electrified GV70, versions: *genesis, models: [Electrified GV70]}
  Lucid:
    fueleconomy: [Lucid USA Inc.]
    rdw: [LUCID MOTORS]
    publisher: {key: lucid, name: Lucid}
    products:
      - {name: Lucid Air, versions: &lucid 'https://lucidmotors.com/knowledge/vehicles/over-the-air/software-updates', models: [Air]}
      - {name: Lucid Gravity, versions: *lucid, models: [Gravity]}
  Changan:  # the page covers the Deepal S05 and S07 for Europe, which the RDW writes under the brand DEEPAL
    rdw: [DEEPAL]
    publisher: {key: changan, name: Changan}
    products:
      - {name: Deepal S05, versions: &changan 'https://www.changaneurope.com/uk/owners/software-and-updates/software-release-notes', models: [S05]}
      - {name: Deepal S07, versions: *changan, models: [S07]}
  # read, but the page names none of the brand's models in the sources
  Honda: {apart: other}  # the page lists the Japanese models with Honda CONNECT; no Prologue, e:NP2 or e:NS2

