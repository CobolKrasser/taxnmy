# Decisions of a person on a publisher (TAX-29): what code held a proposal on (TV3, TV5), decided
# once and valid for every next proposal of that publisher held for the same reason.
# Written with: python tools/pr_referee.py decide <publisher> approve|reject --reason "..."
#   approve  the reason no longer holds a proposal of this publisher; the referee judges it
#   reject   a proposal of this publisher held for this reason is rejected, with this decision
# A collision or an audit finding on a product: rule is the kind, subject the product key. Written with:
# python tools/pr_referee.py settle <product key> stays|proposal (collision), keep|fix|remove (audit)
# A maintainer takes a product out (TK3, TG13): rule remove, subject the key, with its name, publisher
# and sources. Written with: python tools/pr_referee.py remove <product key> --reason "..." --by <who>
# Every decision is kept; a later one on the same subject stands next to it, and the last one counts.
version: 1
decisions: []
