  lenovo/thinkpad-p16-gen1: com.lenovo.ThinkPadN3FBL_000100D4.firmware
  lenovo/thinkpad-t14-gen3: com.lenovo.ThinkPadN3BCZNTC7231.firmware
  lenovo/thinkpad-x13-gen3: com.lenovo.ThinkPadN3CCZIFX152216832.firmware
  lenovo/thinkpad-x13-yoga-gen1: com.lenovo.ThinkPadN2UET.firmware
  lenovo/thinkpad-x13yogagen1: com.lenovo.ThinkPadN2UET.firmware
