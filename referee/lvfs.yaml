# LVFS as a filler (TAX-23): the data tools/lvfs.py needs, so that the code names no brand and no
# address (TG4). A maintainer changes it with a pull request.
#
# The round reads the AppStream metadata that a fwupd client fetches (`fwupdmgr refresh`), once, as a
# file the maintainer gives it (Fred, 22 November 2026: "route 1, fwupd"). The round itself fetches
# nothing from LVFS, and no firmware (.cab).
version: 1

# Where LVFS describes a device: the source of the product and of its versions (criterion 2).
page: 'https://fwupd.org/lvfs/devices/{id}'

# The categories of a component, as Fred approved the analyst's verdict per category (22 November 2026).
# A component with a category of `settings` is no product; one with a category of `parts` is a part of a
# device with its own firmware, outside TAX-23; one with a category of `named` is the firmware of the device
# its name names, and becomes a product only when that device is not in TAX or in the round yet. Every other
# component whose categories are all in `devices` is a device. A component with a category in none of the
# lists (a new one of LVFS), or with none, is set apart with that reason.
#
# The categories of the full metadata (firmware.xml.zst) that the extract did not have, as Fred approved them
# (23 November 2026): X-Gpu to X-Headset a device of its own, X-Battery and X-CpuMicrocode the device the
# name names, X-VideoDisplay and X-InputController a part.
devices: [X-System, X-Device, X-Dock, X-UsbDock, X-Keyboard, X-FlashDrive, X-SolidStateDrive, X-Drive,
          X-NetworkInterface, X-Touchpad, X-FingerprintReader,
          X-Gpu, X-GraphicsTablet, X-Mouse, X-UsbReceiver, X-Camera, X-Headset]
named: [X-ManagementEngine, X-CorporateManagementEngine, X-ConsumerManagementEngine, X-TPM, X-Battery, X-CpuMicrocode]
parts: [X-EmbeddedController, X-Controller, X-ThunderboltController, X-BaseboardManagementController,
        X-VideoDisplay, X-InputController]
settings: [X-Configuration]

# A row of models (TAX-62): words in a name that are no part of a model, as regular expressions. They are
# dropped before the rule reads the row (the analyst, PR #89).
row_additions: ['\s*-?\s*China HDD Protection', '\s+DALI\b', '\s+LCN\b', '\s+BCL\b']
