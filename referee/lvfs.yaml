# LVFS as a filler (TAX-23): the data tools/lvfs.py needs, so that the code names no brand and no
# address (TG4). A maintainer changes it with a pull request.
#
# The round reads the AppStream metadata that a fwupd client fetches (`fwupdmgr refresh`), once, as a
# file the maintainer gives it (Fred, 22 November 2026: "route 1, fwupd"). The round itself fetches
# nothing from LVFS, and no firmware (.cab).
version: 1

# Where LVFS describes a device: the source of the product and of its versions (criterion 2).
page: 'https://fwupd.org/lvfs/devices/{id}'

# The categories of a component, as Fred approved the analyst's verdict per category (22 November 2026).
# A component with a category of `settings` is no product; one with a category of `parts` is a part of a
# device with its own firmware, outside TAX-23; one with a category of `named` is the firmware of the device
# its name names, and becomes a product only when that device is not in TAX or in the round yet. Every other
# component whose categories are all in `devices` is a device. A component with a category in none of the
# lists (a new one of LVFS), or with none, is set apart with that reason.
#
# The categories of the full metadata (firmware.xml.zst) that the extract did not have, as Fred approved them
# (23 November 2026): X-Gpu to X-Headset a device of its own, X-Battery and X-CpuMicrocode the device the
# name names, X-VideoDisplay and X-InputController a part.
devices: [X-System, X-Device, X-Dock, X-UsbDock, X-Keyboard, X-FlashDrive, X-SolidStateDrive, X-Drive,
          X-NetworkInterface, X-Touchpad, X-FingerprintReader,
          X-Gpu, X-GraphicsTablet, X-Mouse, X-UsbReceiver, X-Camera, X-Headset]
named: [X-ManagementEngine, X-CorporateManagementEngine, X-ConsumerManagementEngine, X-TPM, X-Battery, X-CpuMicrocode]
parts: [X-EmbeddedController, X-Controller, X-ThunderboltController, X-BaseboardManagementController,
        X-VideoDisplay, X-InputController]
settings: [X-Configuration]

# A row of models (TAX-62): words in a name that are no part of a model, as regular expressions. They are
# dropped before the rule reads the row (the analyst, PR #89).
row_additions: ['\s*-?\s*China HDD Protection', '\s+DALI\b', '\s+LCN\b', '\s+BCL\b']

# Rows of models written with a space, an underscore or "and" instead of a slash or a comma, which the rule
# cannot see. Read one by one by a model, not by an API call (Fred, 23 November 2026: "Bij LVFS splits die
# producten ook maar. Gebruik je AI logica daar"): the name as LVFS writes it, and its models, the first being
# the name and the key. A name with doubt stays whole and is not in this list: capacities of an SSD, chipsets,
# an addition for the whole row ("... AMD"), a model that cannot be completed without doubt, and a model TAX
# already has under another spelling.
rows:
  'ThinkPad T580 P52s': [ThinkPad T580, ThinkPad P52s]
  'ThinkPad X395 T495s': [ThinkPad X395, ThinkPad T495s]
  'ThinkPad P1 and X1 Extreme': [ThinkPad P1, ThinkPad X1 Extreme]
  'ThinkPad P1 X1 Extreme': [ThinkPad P1, ThinkPad X1 Extreme]
  'ThinkPad P1 Gen2 X1 Extreme 2nd Consumer': [ThinkPad P1 Gen 2, ThinkPad X1 Extreme 2nd]
  'ThinkPad P1 Gen2 X1 Extreme 2nd Corporate': [ThinkPad P1 Gen 2, ThinkPad X1 Extreme 2nd]
  'ThinkPad P1 Gen3 X1 Extreme 3rd Consumer': [ThinkPad P1 Gen 3, ThinkPad X1 Extreme 3rd]
  'ThinkPad P1 Gen3 X1 Extreme 3rd Corporate': [ThinkPad P1 Gen 3, ThinkPad X1 Extreme 3rd]
  'ThinkPad T14 Gen 1 ThinkPad P14s Gen 1': [ThinkPad T14 Gen 1, ThinkPad P14s Gen 1]
  'ThinkPad T14 Gen 2i P14s Gen 2i': [ThinkPad T14 Gen 2i, ThinkPad P14s Gen 2i]
  'ThinkPad T14 Gen 2i_ThinkPad P14s Gen 2i': [ThinkPad T14 Gen 2i, ThinkPad P14s Gen 2i]
  'ThinkPad T14 Gen 3 P14s Gen 3': [ThinkPad T14 Gen 3, ThinkPad P14s Gen 3]
  'ThinkPad T14 Gen3 P14s Gen3': [ThinkPad T14 Gen 3, ThinkPad P14s Gen 3]
  'ThinkPad T15 Gen 2 P15s Gen 2': [ThinkPad T15 Gen 2, ThinkPad P15s Gen 2]
  'ThinkPad T16 Gen 1 P16s Gen 1': [ThinkPad T16 Gen 1, ThinkPad P16s Gen 1]
  'ThinkPad T16 Gen1 P16s Gen1': [ThinkPad T16 Gen 1, ThinkPad P16s Gen 1]
  'ThinkPad L14 and L15 Gen 3': [ThinkPad L14 Gen 3, ThinkPad L15 Gen 3]
  'ThinkPad L14 and L15 Gen3': [ThinkPad L14 Gen 3, ThinkPad L15 Gen 3]
  'ThinkPad L14 and L15 Gen 3 Vpro MEFW': [ThinkPad L14 Gen 3, ThinkPad L15 Gen 3]
  'ThinkPad L14 and L15 Gen 3 NonVpro MEFW': [ThinkPad L14 Gen 3, ThinkPad L15 Gen 3]
  'ThinkPad L14 L15 Gen 4': [ThinkPad L14 Gen 4, ThinkPad L15 Gen 4]
  'ThinkCentre M90ts_ThinkCentre M80ts_ThinkCentre M70ts': [ThinkCentre M90ts, ThinkCentre M80ts, ThinkCentre M70ts]
  'Think M950ts_Think M70ts-4': [ThinkCentre M950ts, ThinkCentre M70ts-4]
  'ThinkCentre Neo 50q Gen4 and IdeaCentre Mini5i': [ThinkCentre Neo 50q Gen 4, IdeaCentre Mini 5i]

# Products of LVFS that one product took in as an alias when the register was made free of doubles (TAX-66),
# with the id of LVFS that was the source of each. The product that holds the alias came from that id as well,
# so it carries the GUIDs LVFS names at it (TAX-68, tools/references.py).
