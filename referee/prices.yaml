# Prices of the Claude API, in US dollars, per million tokens.
# Source: https://platform.claude.com/docs/en/about-claude/pricing (read 2026-11-13).
# The harness refuses to price a token type that has no price here.
source: https://platform.claude.com/docs/en/about-claude/pricing
read: 2026-11-13
web_search_per_1000: 10.00   # web fetch has no charge beyond its tokens
models:
  claude-opus-5-5:
    input: 4.00
    cache_write_5m: 5.00
    cache_read: 0.20
    output: 20.00
  claude-sonnet-5-5:
    input: 2.00
    cache_write_5m: 2.50
    cache_read: 0.10
    output: 10.00
  claude-haiku-5-5:   # for prompts up to 100,000 tokens
    input: 0.10
    cache_write_5m: 0.125
    cache_read: 0.01
    output: 0.50
