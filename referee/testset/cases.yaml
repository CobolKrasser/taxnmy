# ---------------------------------------------------------------------------------------------
# AI MODELS — once for a person; good since 13 November 2026: AI models are in TAX.
# ---------------------------------------------------------------------------------------------

- id: H01
  type: ai-model
  expect: [accept]
  lint: pass
  holdout: [products/anthropic/claude.yaml, publishers/anthropic.yaml]
  verify: [https://www.anthropic.com/company]
  note: AI models belong in TAX (13 November 2026), one product per provider with the model names as versions and an end date per version, as endoflife.date keeps them. The id stays H01; the case is now a good one.
- id: H02
  type: ai-model
  expect: [accept, parked]
  lint: pass
  holdout: [products/openai/openai-api-models.yaml, publishers/openai.yaml]
  verify: [https://developers.openai.com/api/docs/deprecations]
  note: As H01. The publisher source is OpenAI's own deprecations page; openai.com/about answers 403 to a plain fetch. "OpenAI API Models" is the name endoflife.date gives the product. OpenAI has no overarching name for its models, so whether this is a name (TK2) is a real border case, and parked is right too (run A2 review §1, point 5).

