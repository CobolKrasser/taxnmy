# TAXNMY referee testset, version 1 (13 November 2026)
#
# 65 proposals: 28 good, 35 bad, 2 for a person (H01 and H02 are good since 13 November: AI models are in TAX). How to read and run them: referee/testset/README.md.
#
# Fields per case
#   id        G.. good, B.. bad, H.. the AI models (once for a person, now good)
#   expect    the outcomes that count as right: accept | reject | alias | human
#   rules     for a bad case: the rules of which at least one must answer "no" (or the lint rule)
#   alias_of  for expect alias: the key the proposal duplicates
#   lint      what tools/lint.py reports on the staged case: pass | signal | error S1/S2/S3
#   type      the kind of case, used to report results per kind
#   holdout   files taken out of the dataset and proposed again, unchanged
#   hide      files taken out of the dataset and not proposed
#   context   files added to the dataset before the case runs
#   proposal  files proposed: path -> file content
#   verify    URLs written for this testset; check them before the run (see README)
#   note      why the expectation is what it is

version: 1
cases:

