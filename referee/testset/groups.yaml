# The test set of the grouping per publisher (TAX-26): 15 publishers of the KEV list of CISA
# (entries added from 16 November 2023 to 17 November 2026), with every name that KEV and the CNA
# of each CVE record write for them. Collected with `tools/group.py collect --kev ... --cve ...`
# (ADP names and "n/a" left out); the versions are those the CNA lists as affected.
#
# expect: the class a person gives the name; a list when the hand accepts more than one, the first
#         being the one meant. of: per class the product it belongs to, an existing key or a name of
#         the case. For a group of names that are one new product, which one is the product and
#         which the aliases is free: the comparison looks at the products, not at which name leads.
# existing: the products of TAX the case shows; others of the publisher are left out, so that the
#         case does not change when TAX grows.
# status: "proposed" is the builder's proposal; the tester sets "checked" once every name is
#         confirmed or corrected. A live run refuses a case that is not checked.
#
# The test set may name brands and products (TG4); the prompt may not.

